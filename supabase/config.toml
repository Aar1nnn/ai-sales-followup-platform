project_id = "ai-sales-followup-platform-v1"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "crm"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://127.0.0.1:5173/login", "http://127.0.0.1:5173/set-password", "http://localhost:5173", "http://localhost:5173/login", "http://localhost:5173/set-password"]
jwt_expiry = 3600
enable_signup = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.lead-intake]
verify_jwt = false

[functions.webhook-feishu]
verify_jwt = false

[functions.execute-command]
verify_jwt = false

[functions.channel-send]
verify_jwt = false

[functions.channel-validate]
verify_jwt = false

[functions.purge-organization]
verify_jwt = false

[functions.member-admin]
verify_jwt = false
