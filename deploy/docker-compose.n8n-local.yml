name: ai-sales-followup-platform-n8n-local

services:
  n8n-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  n8n:
    image: ${N8N_IMAGE:?Pin N8N_IMAGE to an approved version}
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set persistent N8N_ENCRYPTION_KEY}
      N8N_HOST: 127.0.0.1
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 0
      N8N_SECURE_COOKIE: "false"
      N8N_EDITOR_BASE_URL: http://127.0.0.1:${N8N_PORT:-5678}/
      N8N_WEBHOOK_URL: http://127.0.0.1:${N8N_PORT:-5678}/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_TASK_TIMEOUT: 60
      N8N_PYTHON_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      CRM_APP_URL: ${CRM_APP_URL:?Set CRM_APP_URL}
      SYSTEM_ACTOR_USER_ID: ${SYSTEM_ACTOR_USER_ID:?Set SYSTEM_ACTOR_USER_ID}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_PROVIDER: ${AI_PROVIDER:-aliyun_bailian}
    volumes:
      - n8n-data:/home/node/.n8n
      - ../n8n-workflows:/opt/n8n-workflows:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 30s

volumes:
  n8n-data:
    name: ai-sales-followup-platform-n8n-data
  n8n-postgres-data:
    name: ai-sales-followup-platform-n8n-postgres-data
