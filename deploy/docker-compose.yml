name: ai-sales-followup-platform

services:
  frontend-nginx:
    build:
      context: ..
      args:
        SUPABASE_BROWSER_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL}
        SUPABASE_BROWSER_PUBLISHABLE_VALUE: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  n8n-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: ${N8N_IMAGE:?Pin N8N_IMAGE to an approved version}
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set persistent N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:?Set public n8n host}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      CRM_APP_URL: ${CRM_APP_URL:?Set CRM_APP_URL}
      SYSTEM_ACTOR_USER_ID: ${SYSTEM_ACTOR_USER_ID:?Set SYSTEM_ACTOR_USER_ID}
      AI_BASE_URL: ${AI_BASE_URL:?Set AI_BASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-aliyun_bailian}
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  n8n-data:
  n8n-postgres-data:
